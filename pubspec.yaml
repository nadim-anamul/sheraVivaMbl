name: sera_viva
description: Sera Viva - Bangladeshi job mock viva platform (Android)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  dio: ^5.8.0+1
  equatable: ^2.0.7
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  json_annotation: ^4.9.0
  syncfusion_flutter_pdfviewer: ^33.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
  assets:
    - assets/data/viva_exams_config.json
    - assets/data/bcs_viva_library.json
    - assets/data/primary_viva_library.json
    - assets/data/job_circulars.json
    - assets/data/job_results.json
